name: "Publish Cookbook"

on:
  push:
    paths:
    - '**.rst'
    - 'assets/**'
    - '.github/workflows/publish_book.yml'
    - 'scripts/**'

  workflow_dispatch:

jobs:
  # Determine which books actually need rebuilding based on the RST include
  # graph and the files changed in this push. On manual dispatch (or when a
  # diff base is unavailable) every book is built.
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_books: ${{ steps.detect.outputs.has_books }}
      books: ${{ steps.detect.outputs.books }}
      all_books: ${{ steps.detect.outputs.all_books }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Determine books to build
        id: detect
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          EVENT="${{ github.event_name }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Building ALL books (manual dispatch or no usable diff base)."
            MATRIX=$(python scripts/book_deps.py list --matrix)
          else
            echo "Diffing $BEFORE..${{ github.sha }}"
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            echo "Changed files:"; echo "$CHANGED"
            MATRIX=$(printf '%s\n' "$CHANGED" | python scripts/book_deps.py changed --matrix --stdin)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$MATRIX" | python -c "import sys,json; print(len(json.load(sys.stdin)['include']))")
          if [ "$COUNT" -gt 0 ]; then echo "has_books=true" >> "$GITHUB_OUTPUT"; else echo "has_books=false" >> "$GITHUB_OUTPUT"; fi
          # Space-separated list of the books built this run (for the release job).
          BOOKS=$(echo "$MATRIX" | python -c "import sys,json; print(' '.join(e['book'] for e in json.load(sys.stdin)['include']))")
          echo "books=$BOOKS" >> "$GITHUB_OUTPUT"
          # Space-separated list of ALL books that exist (the complete release set).
          ALL_BOOKS=$(python scripts/book_deps.py list | tr '\n' ' ' | sed 's/ *$//')
          echo "all_books=$ALL_BOOKS" >> "$GITHUB_OUTPUT"
          echo "Resulting matrix: $MATRIX"
          echo "Books this run: $BOOKS"
          echo "All books: $ALL_BOOKS"

  build_pdf:
    needs: detect_changes
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.x
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install apt dependencies
      run: |
        sudo apt-get update && sudo apt-get -y install plantuml libxml2-dev libxslt-dev python3-dev

    - name: Install pip dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade rst2pdf

    - name: Compute version and build substitution file
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # Pull the current version manifest from the rolling `latest` release
        # (absent on first run -> treated as empty, books get seeded).
        gh release download latest --pattern manifest.json --output manifest.json 2>/dev/null || echo '{}' > manifest.json
        VERSION=$(python scripts/book_versions.py next manifest.json "${{ matrix.book }}")
        echo "Version for ${{ matrix.book }}: $VERSION"
        echo ".. |Date| replace:: $(date +%B\ %d\,\ %Y)" > temp_substitutions.rst
        echo "  " >> temp_substitutions.rst
        echo ".. |Revision| replace:: $VERSION" >> temp_substitutions.rst
        echo "  " >> temp_substitutions.rst

    - name: Select stylesheet (per-book override or shared)
      id: style
      run: |
        if [ -f "assets/${{ matrix.book }}.yaml" ]; then
          echo "sheet=assets/${{ matrix.book }}.yaml" >> "$GITHUB_OUTPUT"
        else
          echo "sheet=assets/Cookbook.yaml" >> "$GITHUB_OUTPUT"
        fi

    - name: Select cover (per-book override or shared)
      id: cover
      run: |
        if [ -f "assets/${{ matrix.book }}.Cover.png" ]; then
          echo "cover=assets/${{ matrix.book }}.Cover.png" >> "$GITHUB_OUTPUT"
        else
          echo "cover=assets/Cover.png" >> "$GITHUB_OUTPUT"
        fi

    - name: Build cover overlay stylesheet
      run: |
        # Override only the cover page background so the base stylesheet's
        # layout is preserved. Later --stylesheets entries win in rst2pdf.
        # printf (not an indented heredoc) keeps the YAML left-aligned.
        printf 'pageTemplates:\n  coverPage:\n    background: %s\n' \
          "${{ steps.cover.outputs.cover }}" > cover_overlay.yaml
        echo "--- cover_overlay.yaml ---"; cat cover_overlay.yaml

    - name: Select per-book rst2pdf extensions
      id: ext
      run: |
        # The MealPlanner uses a transform that nests each recipe under its
        # week in the ToC. Other books don't need it.
        if [ "${{ matrix.book }}" = "MealPlannerBook" ]; then
          echo "extra=--extension-module=scripts/mealplanner_toc.py" >> "$GITHUB_OUTPUT"
        else
          echo "extra=" >> "$GITHUB_OUTPUT"
        fi

    - name: Compute published output name
      id: out
      run: |
        # Published files are prefixed with "TheMessyChef-" — except the main
        # TheMessyChef book, which keeps its bare name.
        if [ "${{ matrix.book }}" = "TheMessyChef" ]; then
          echo "name=TheMessyChef" >> "$GITHUB_OUTPUT"
        else
          echo "name=TheMessyChef-${{ matrix.book }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build pdf
      run: |
        rm -fR *.build_temp
        rst2pdf Books/${{ matrix.book }}.rst \
          --break-level=1 \
          --section-header-depth=1 \
          --fit-background-mode=scale \
          --smart-quotes=0 \
          --fit-literal-mode=shrink \
          --repeat-table-rows \
          --stylesheets=${{ steps.style.outputs.sheet }},cover_overlay.yaml \
          --output="${{ steps.out.outputs.name }}.pdf" \
          --strip-elements-with-class=handout \
          --extension-module=preprocess \
          ${{ steps.ext.outputs.extra }}
        rm -fR *.build_temp

    - name: Save Published pdf files
      uses: actions/upload-artifact@v5
      with:
        name: published-files-pdf-${{ matrix.book }}
        path: |
          ${{ steps.out.outputs.name }}.pdf
        if-no-files-found: error

  build_html:
    needs: detect_changes
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.x
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install apt dependencies
      run: |
        sudo apt-get update && sudo apt-get -y install plantuml libxml2-dev libxslt-dev python3-dev

    - name: Install pip dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade rst2html5

    - name: Compute version and build substitution file
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # Pull the current version manifest from the rolling `latest` release
        # (absent on first run -> treated as empty, books get seeded).
        gh release download latest --pattern manifest.json --output manifest.json 2>/dev/null || echo '{}' > manifest.json
        VERSION=$(python scripts/book_versions.py next manifest.json "${{ matrix.book }}")
        echo ".. |Date| replace:: $(date +%B\ %d\,\ %Y)" > temp_substitutions.rst
        echo "  " >> temp_substitutions.rst
        echo ".. |Revision| replace:: $VERSION" >> temp_substitutions.rst
        echo "  " >> temp_substitutions.rst

    - name: Select stylesheet (per-book override or shared)
      id: style
      run: |
        if [ -f "assets/${{ matrix.book }}.css" ]; then
          echo "sheet=assets/${{ matrix.book }}.css" >> "$GITHUB_OUTPUT"
        else
          echo "sheet=assets/Cookbook.css" >> "$GITHUB_OUTPUT"
        fi

    - name: Build html
      run: |
        rst2html5 \
            --stylesheet-inline=${{ steps.style.outputs.sheet }} \
            --strip-elements-with-class=handout \
            --strip-comments \
            Books/${{ matrix.book }}.html.rst \
            "${{ matrix.book }}.html"
        rm -fR *.build_temp

    - name: Save Published html files
      uses: actions/upload-artifact@v5
      with:
        name: published-files-html-${{ matrix.book }}
        path: |
          ${{ matrix.book }}.html
        if-no-files-found: error

  build_epub:
    needs: [detect_changes, build_html]
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - name: Install Calabre
      run: |
        sudo apt-get update && sudo apt-get -y install calibre

    - uses: actions/checkout@v5

    - name: Book metadata
      id: meta
      run: |
        case "${{ matrix.book }}" in
          TheMessyChef)
            echo 'title=Recipes From the Messy Chef' >> "$GITHUB_OUTPUT"
            echo 'comments=A collection of recipes containing the favorites of Rodney Shupe and family.' >> "$GITHUB_OUTPUT" ;;
          AirFryerRecipes)
            echo 'title=Air Fryer Recipes From the Messy Chef' >> "$GITHUB_OUTPUT"
            echo 'comments=A collection of air fryer recipes from Rodney Shupe and family.' >> "$GITHUB_OUTPUT" ;;
          PressureCookerRecipes)
            echo 'title=Pressure Cooker Recipes From the Messy Chef' >> "$GITHUB_OUTPUT"
            echo 'comments=A collection of pressure cooker recipes from Rodney Shupe and family.' >> "$GITHUB_OUTPUT" ;;
          SousVideRecipes)
            echo 'title=Sous-Vide Recipes From the Messy Chef' >> "$GITHUB_OUTPUT"
            echo 'comments=A collection of sous-vide recipes from Rodney Shupe and family.' >> "$GITHUB_OUTPUT" ;;
          MealPlannerBook)
            echo 'title=Weekly Meal Planner' >> "$GITHUB_OUTPUT"
            echo 'comments=A 5-week curated meal planner, shopping guide, and no-repeat modular recipes from Rodney Shupe and family.' >> "$GITHUB_OUTPUT" ;;
          *)
            echo 'title=${{ matrix.book }}' >> "$GITHUB_OUTPUT"
            echo 'comments=From the Messy Chef.' >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Download latest html output files.
      uses: actions/download-artifact@v5
      with:
        name: published-files-html-${{ matrix.book }}

    - name: Select cover (per-book override or shared)
      id: cover
      run: |
        if [ -f "assets/${{ matrix.book }}.Cover.png" ]; then
          echo "cover=assets/${{ matrix.book }}.Cover.png" >> "$GITHUB_OUTPUT"
        else
          echo "cover=assets/Cover.png" >> "$GITHUB_OUTPUT"
        fi

    - name: Compute published output name
      id: out
      run: |
        # Published files are prefixed with "TheMessyChef-" — except the main
        # TheMessyChef book, which keeps its bare name.
        if [ "${{ matrix.book }}" = "TheMessyChef" ]; then
          echo "name=TheMessyChef" >> "$GITHUB_OUTPUT"
        else
          echo "name=TheMessyChef-${{ matrix.book }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build epub
      run: |
        ebook-convert "${{ matrix.book }}.html" "${{ steps.out.outputs.name }}.epub" \
          --title "${{ steps.meta.outputs.title }}" \
          --authors "Rodney Shupe" \
          --author-sort "Shupe Rodney" \
          --language English \
          --comments "${{ steps.meta.outputs.comments }}" \
          --tags Cookbook,Cooking,Recipes \
          --cover ${{ steps.cover.outputs.cover }} \
          --max-toc-links 29 \
          --embed-all-fonts > /dev/null

    - name: Save Published epub files
      uses: actions/upload-artifact@v5
      with:
        name: published-files-epub-${{ matrix.book }}
        path: |
          ${{ steps.out.outputs.name }}.epub
        if-no-files-found: error

  build_website:
    needs: [detect_changes, build_html]
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - name: Setup Environment
      run: |
        sudo apt-get update && sudo apt-get install html-xml-utils htmldoc
        mkdir www

    - name: Set some Environment Variables.
      run: |
        echo "OUT_DIR=www" >> $GITHUB_ENV

    - name: Compute published output name
      id: out
      run: |
        # Published files are prefixed with "TheMessyChef-" — except the main
        # TheMessyChef book, which keeps its bare name.
        if [ "${{ matrix.book }}" = "TheMessyChef" ]; then
          echo "name=TheMessyChef" >> "$GITHUB_OUTPUT"
        else
          echo "name=TheMessyChef-${{ matrix.book }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download latest html output files.
      uses: actions/download-artifact@v5
      with:
        name: published-files-html-${{ matrix.book }}

    - name: Strip TOC
      run: |
        cat "${{ matrix.book }}.html" | hxremove 'aside' > "Stripped_${{ matrix.book }}.html"

    - name: Split Published HTML into multiple files.
      run: |
        rm --recursive --force "${{ env.OUT_DIR }}"
        mkdir --parents "${{ env.OUT_DIR }}"
        htmldoc --format htmlsep \
            --outdir "${{ env.OUT_DIR }}" \
            --headfootfont sans \
            --no-title \
            --toclevels 2 \
            --toctitle "Contents" \
            --quiet \
            "Stripped_${{ matrix.book }}.html"

    - name: Breakout individual directories.
      run: |
        START_DIR="${PWD}"
        cd "${{ env.OUT_DIR }}"
        HREFS="$(cat index.html \
          | hxnormalize -x \
          | grep --ignore-case '<a HREF="' \
          | grep --no-messages --invert-match --ignore-case '.html#1">' \
          | sed 's/.*<li><a href="//gi' \
          | sed 's/".*//g' \
          | tr '\n' ' ')"
        for HREF in ${HREFS}; do
            HTML_FILE=$(echo ${HREF} | cut -d'#' -f 1)
            if test -f ${HTML_FILE}; then
                FILE=$(basename ${HTML_FILE})
                DIR_NAME="${FILE%.html}"
                TITLE="$(cat ${HTML_FILE} \
                  | hxnormalize -x \
                  | grep --ignore-case '<h2>.*<a[^>]*NAME="' \
                  | sed 's/<h2>.*<a[^>]*>//gi' \
                  | sed 's/<\/a>.*<\/h2>//gi' \
                  )"
                echo "Processing ${HTML_FILE} (${TITLE}) into ${DIR_NAME}"
                cat ${HTML_FILE} \
                    | hxnormalize -x \
                    | hxremove -i hr \
                    | grep --no-messages --invert-match '<p><a' \
                    | grep --no-messages --invert-match '<p style="page-break-before: always">' \
                    | hxnormalize -x \
                    > temp.html
                rm --recursive --force ${DIR_NAME}
                mkdir --parents ${DIR_NAME}
                htmldoc --format htmlsep \
                    --outdir ${DIR_NAME} \
                    --no-title \
                    --toclevels 3 \
                    --toctitle "${TITLE}" \
                    --quiet \
                    temp.html
                rm ${HTML_FILE}
                sed --in-place "s/${HREF}/${DIR_NAME}\/index.html/" index.html
            else
                echo "Unable to process ${HTML_FILE}"
            fi
        done;
        cd "${START_DIR}"

    - name: Bundle into tar file.
      run: |
        tar --create --file="${{ steps.out.outputs.name }}.www.tar" www

    - name: Save Published www files
      uses: actions/upload-artifact@v5
      with:
        name: published-files-www-${{ matrix.book }}
        path: |
          ${{ steps.out.outputs.name }}.www.tar
        if-no-files-found: error

  upload_website:
    needs: [detect_changes, build_website]
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - name: Compute published output name
      id: out
      run: |
        # Published files are prefixed with "TheMessyChef-" — except the main
        # TheMessyChef book, which keeps its bare name.
        if [ "${{ matrix.book }}" = "TheMessyChef" ]; then
          echo "name=TheMessyChef" >> "$GITHUB_OUTPUT"
        else
          echo "name=TheMessyChef-${{ matrix.book }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download latest www output files.
      uses: actions/download-artifact@v5
      with:
        name: published-files-www-${{ matrix.book }}

    - name: Push Website to GDrive.
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: copy ${{ steps.out.outputs.name }}.www.tar gdrive:Cooking

  # Single rolling release, tagged `latest`, that always holds the complete set
  # of book assets (PDF/EPUB/website) for EVERY book — even the ones not rebuilt
  # this run. Books built this run use their fresh artifacts; the rest are
  # carried forward from the previous `latest` release. Per-book versions and
  # last-updated dates are tracked in manifest.json (an asset on the release).
  release:
    needs: [detect_changes, build_pdf, build_epub, build_website]
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.x
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Download this run's built artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: published-files-*
        path: fresh
        merge-multiple: true

    - name: Assemble complete release asset set + manifest + notes
      id: assemble
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHANGED_BOOKS: ${{ needs.detect_changes.outputs.books }}
        ALL_BOOKS: ${{ needs.detect_changes.outputs.all_books }}
      run: |
        set -euo pipefail
        TODAY=$(date +%F)
        mkdir -p assets_out prev

        # Published filename for a book: TheMessyChef- prefix except the main book.
        pubname() {
          if [ "$1" = "TheMessyChef" ]; then echo "TheMessyChef"; else echo "TheMessyChef-$1"; fi
        }

        # Pull the previous rolling release: its manifest + all carried-forward
        # assets. Absent on the very first run -> seed an empty manifest.
        if gh release download latest --dir prev 2>/dev/null; then
          echo "Downloaded previous 'latest' release assets."
        else
          echo "No previous 'latest' release; starting fresh."
        fi
        if [ -f prev/manifest.json ]; then
          cp prev/manifest.json manifest.json
        else
          echo '{}' > manifest.json
        fi

        # Build the complete asset set. For each book+ext, prefer this run's
        # freshly-built file; otherwise carry forward the previous release's.
        CHANGED=" ${CHANGED_BOOKS} "
        NOTES_CHANGED=""
        NOTES_UNCHANGED=""
        for BOOK in ${ALL_BOOKS}; do
          NAME=$(pubname "$BOOK")
          for EXT in pdf epub www.tar; do
            if [ -f "fresh/${NAME}.${EXT}" ]; then
              cp "fresh/${NAME}.${EXT}" "assets_out/${NAME}.${EXT}"
            elif [ -f "prev/${NAME}.${EXT}" ]; then
              cp "prev/${NAME}.${EXT}" "assets_out/${NAME}.${EXT}"
            else
              echo "WARNING: no ${EXT} for ${BOOK} (neither fresh nor previous)."
            fi
          done

          if [ "$CHANGED" != "${CHANGED/ $BOOK / }" ]; then
            # Changed this run: bump to the next version, stamp today's date.
            VER=$(python scripts/book_versions.py next manifest.json "$BOOK")
            python scripts/book_versions.py set manifest.json "$BOOK" "$VER" "$TODAY" >/dev/null
            NOTES_CHANGED="${NOTES_CHANGED}- ${BOOK} — v${VER} (updated ${TODAY})"$'\n'
          else
            # Unchanged: carry forward version + last-updated date for the notes.
            VER=$(python scripts/book_versions.py current manifest.json "$BOOK")
            UPD=$(python scripts/book_versions.py updated manifest.json "$BOOK")
            if [ -n "$UPD" ]; then
              NOTES_UNCHANGED="${NOTES_UNCHANGED}- ${BOOK} — v${VER} (last updated ${UPD})"$'\n'
            else
              NOTES_UNCHANGED="${NOTES_UNCHANGED}- ${BOOK} — v${VER}"$'\n'
            fi
          fi
        done

        cp manifest.json assets_out/manifest.json

        # Compose the release notes body.
        {
          echo "Cookbook release — ${TODAY}"
          echo ""
          if [ -n "$NOTES_CHANGED" ]; then
            echo "Updated this release:"
            printf '%s' "$NOTES_CHANGED"
            echo ""
          fi
          if [ -n "$NOTES_UNCHANGED" ]; then
            echo "Unchanged:"
            printf '%s' "$NOTES_UNCHANGED"
          fi
        } > release_notes.md

        echo "--- release_notes.md ---"; cat release_notes.md
        echo "--- manifest.json ---"; cat manifest.json
        echo "--- assets_out ---"; ls -la assets_out

    - name: Publish rolling 'latest' release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: latest
        name: Cookbook (latest)
        body_path: release_notes.md
        draft: false
        prerelease: false
        # Replace the release's asset set with the freshly assembled complete set.
        files: |
          assets_out/*

  publish_to_google:
    needs: [detect_changes, build_pdf, build_epub]
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - name: Compute published output name
      id: out
      run: |
        # Published files are prefixed with "TheMessyChef-" — except the main
        # TheMessyChef book, which keeps its bare name.
        if [ "${{ matrix.book }}" = "TheMessyChef" ]; then
          echo "name=TheMessyChef" >> "$GITHUB_OUTPUT"
        else
          echo "name=TheMessyChef-${{ matrix.book }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download latest output pdf files.
      uses: actions/download-artifact@v5
      with:
        name: published-files-pdf-${{ matrix.book }}

    - name: Push PDF to GDrive.
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: copy ${{ steps.out.outputs.name }}.pdf gdrive:Cooking

    - name: Download latest output epub files.
      uses: actions/download-artifact@v5
      with:
        name: published-files-epub-${{ matrix.book }}

    - name: Push EPUB to GDrive.
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: copy ${{ steps.out.outputs.name }}.epub gdrive:Cooking

  publish_to_dropbox:
    needs: [detect_changes, build_epub]
    if: needs.detect_changes.outputs.has_books == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
    - name: Compute published output name
      id: out
      run: |
        # Published files are prefixed with "TheMessyChef-" — except the main
        # TheMessyChef book, which keeps its bare name.
        if [ "${{ matrix.book }}" = "TheMessyChef" ]; then
          echo "name=TheMessyChef" >> "$GITHUB_OUTPUT"
        else
          echo "name=TheMessyChef-${{ matrix.book }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download latest output epub files.
      uses: actions/download-artifact@v5
      with:
        name: published-files-epub-${{ matrix.book }}

    # Information on setup: https://github.com/Lewuathe/dropbox-github-action
    - name: Upload to Dropbox
      uses: Lewuathe/dropbox-github-action@v1.0.3
      with:
        dropbox-app-key: ${{ secrets.DROPBOX_APP_KEY }}
        dropbox-app-secret: ${{ secrets.DROPBOX_APP_SECRET }}
        dropbox-refresh-token: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        source-path: ${{ steps.out.outputs.name }}.epub
        target-path: "/Apps/Rakuten Kobo/${{ steps.out.outputs.name }}.epub" # <--- Fixed target path with filename included
        write-mode: overwrite